name: Deploy to Production

on:
  push:
    branches: [ankurshala/prod-1.0-final]
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: 'Force rebuild all images'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

env:
  VM_IP: 74.225.207.72
  VM_USER: AnkurshalaVM

jobs:
  # ============================================
  # Stage 1: Test Code Quality
  # ============================================
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
      
      - name: Backend Compile Check
        working-directory: backend
        run: |
          ./mvnw clean compile -DskipTests -B -q
          echo "✅ Backend compiles successfully"
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Frontend Build Check
        working-directory: frontend
        run: |
          npm ci --legacy-peer-deps
          npm run build
          echo "✅ Frontend builds successfully"

  # ============================================
  # Stage 2: Deploy to Production
  # ============================================
  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
      
      - name: Add SSH Known Hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ env.VM_IP }} >> ~/.ssh/known_hosts
      
      - name: Test SSH Connection
        run: |
          ssh ${{ env.VM_USER }}@${{ env.VM_IP }} "echo '✅ SSH connection successful'"
      
      - name: Deploy to Server
        env:
          FORCE_REBUILD: ${{ github.event.inputs.force_rebuild || 'false' }}
        run: |
          echo "🚀 Starting deployment to production..."
          echo "   Commit: ${{ github.sha }}"
          echo "   Branch: ${{ github.ref_name }}"
          echo "   Force Rebuild: $FORCE_REBUILD"
          
          ssh ${{ env.VM_USER }}@${{ env.VM_IP }} << 'DEPLOY_SCRIPT'
          set -e
          
          echo "📁 Navigating to project directory..."
          cd /opt/ankurshala
          
          echo "📥 Pulling latest code from GitHub..."
          # Ensure we're on the correct branch first
          git checkout ankurshala/prod-1.0-final 2>/dev/null || git checkout -b ankurshala/prod-1.0-final
          
          # Pull latest changes
          git pull origin ankurshala/prod-1.0-final --ff-only || {
            echo "⚠️ Fast-forward failed, forcing reset..."
            git fetch origin ankurshala/prod-1.0-final
            git reset --hard FETCH_HEAD
          }
          
          echo "📋 Loading environment variables..."
          export $(cat .env-prod | grep -v '^#' | xargs)
          
          echo "🔍 Checking current service status..."
          docker compose -f docker-compose.prod.yml ps
          
          echo "🏗️ Building and deploying services..."
          
          # Build and restart backend
          echo "🔨 Building backend..."
          docker compose -f docker-compose.prod.yml build --no-cache backend
          
          echo "🔨 Building frontend..."
          docker compose -f docker-compose.prod.yml build --no-cache frontend
          
          echo "🔄 Stopping old containers..."
          docker compose -f docker-compose.prod.yml stop backend frontend || true
          
          echo "🚀 Starting updated containers..."
          docker compose -f docker-compose.prod.yml up -d
          
          echo "⏳ Waiting for services to start (60 seconds)..."
          sleep 60
          
          echo "🏥 Checking service health..."
          
          # Check backend health
          for i in {1..30}; do
            if docker exec ankurshala_backend_prod wget -q --spider http://localhost:8080/api/actuator/health 2>/dev/null; then
              echo "✅ Backend is healthy!"
              break
            fi
            if [ $i -eq 30 ]; then
              echo "⚠️ Backend health check timeout"
              docker logs --tail 50 ankurshala_backend_prod
            else
              echo "   Waiting for backend... ($i/30)"
              sleep 5
            fi
          done
          
          # Check frontend health
          for i in {1..20}; do
            if docker exec ankurshala_frontend_prod wget -q --spider http://localhost:3000 2>/dev/null; then
              echo "✅ Frontend is healthy!"
              break
            fi
            if [ $i -eq 20 ]; then
              echo "⚠️ Frontend health check timeout"
              docker logs --tail 50 ankurshala_frontend_prod
            else
              echo "   Waiting for frontend... ($i/20)"
              sleep 3
            fi
          done
          
          echo ""
          echo "📊 Final service status:"
          docker compose -f docker-compose.prod.yml ps
          
          echo ""
          echo "🧹 Cleaning up old images..."
          docker image prune -f || true
          
          echo ""
          echo "✅ Deployment completed successfully!"
          DEPLOY_SCRIPT

      - name: Verify Deployment
        run: |
          echo "🔍 Verifying deployment from outside..."
          sleep 10
          
          # Check HTTPS health endpoint
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 https://ankurshala.com/health || echo "000")
          echo "Health endpoint: $HTTP_CODE"
          
          if [ "$HTTP_CODE" = "200" ]; then
            echo "✅ Health check passed!"
          else
            echo "⚠️ Health check returned: $HTTP_CODE"
          fi
          
          # Check API health
          API_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 https://ankurshala.com/api/actuator/health || echo "000")
          echo "API health: $API_CODE"
          
          if [ "$API_CODE" = "200" ]; then
            echo "✅ API health check passed!"
          else
            echo "⚠️ API health check returned: $API_CODE"
          fi
          
          # Check homepage
          HOME_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 https://ankurshala.com || echo "000")
          echo "Homepage: $HOME_CODE"
          
          if [ "$HOME_CODE" = "200" ]; then
            echo "✅ Homepage check passed!"
          else
            echo "⚠️ Homepage check returned: $HOME_CODE"
          fi

  # ============================================
  # Stage 3: Deployment Summary
  # ============================================
  summary:
    needs: deploy
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Deployment Summary
        run: |
          echo "=========================================="
          echo "📋 DEPLOYMENT SUMMARY"
          echo "=========================================="
          echo ""
          echo "📌 Commit: ${{ github.sha }}"
          echo "🌿 Branch: ${{ github.ref_name }}"
          echo "👤 Triggered by: ${{ github.actor }}"
          echo "🔢 Run ID: ${{ github.run_id }}"
          echo "📅 Time: $(date)"
          echo ""
          
          if [ "${{ needs.deploy.result }}" = "success" ]; then
            echo "✅ DEPLOYMENT SUCCESSFUL!"
            echo ""
            echo "🔗 Application URLs:"
            echo "   • Homepage: https://ankurshala.com"
            echo "   • Admin: https://ankurshala.com/admin/dashboard"
            echo "   • API Health: https://ankurshala.com/api/actuator/health"
            echo "   • Login: https://ankurshala.com/login"
          else
            echo "❌ DEPLOYMENT FAILED"
            echo ""
            echo "Please check the workflow logs for details."
            echo "You can also SSH to the server and check manually:"
            echo "   ssh AnkurshalaVM@74.225.207.72"
            echo "   cd /opt/ankurshala"
            echo "   docker compose -f docker-compose.prod.yml logs"
          fi
          echo ""
          echo "=========================================="
