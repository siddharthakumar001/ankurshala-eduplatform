# Test configuration for backend
spring:
  profiles:
    active: test
  
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: 
    
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        
  h2:
    console:
      enabled: true
      
  security:
    jwt:
      secret: test-secret-key-for-testing-purposes-only-must-be-at-least-64-characters-long
      access-token-expiration: 900
      refresh-token-expiration: 604800

logging:
  level:
    com.ankurshala.backend: DEBUG
    org.springframework.security: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

app:
  features:
    ai:
      enabled: false
    payments:
      enabled: false
    wallet:
      enabled: true
  booking:
    buffer-minutes: 15
    timezone-default: Asia/Kolkata