spring:
  application:
    name: ankurshala-backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:ankurshala}
    username: ${DB_USERNAME:ankur}
    password: ${DB_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update  # Changed from validate to update for dev to auto-fix schema
      naming:
        physical-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
      repositories:
        enabled: false
  kafka:
    bootstrap-servers: ${KAFKA_BROKERS:kafka:9092}
    consumer:
      group-id: ankurshala-group
      auto-offset-reset: earliest
      enable-auto-commit: true
      auto-commit-interval: 1000
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        max.poll.records: 500
        max.poll.interval.ms: 300000
        session.timeout.ms: 30000
        heartbeat.interval.ms: 3000
        request.timeout.ms: 40000
        connections.max.idle.ms: 540000
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: 1
      retries: 3
      properties:
        max.in.flight.requests.per.connection: 5
        retry.backoff.ms: 100
        request.timeout.ms: 30000
        delivery.timeout.ms: 120000
        linger.ms: 0
        batch.size: 16384
        buffer.memory: 33554432
        compression.type: snappy
    properties:
      reconnect.backoff.ms: 50
      reconnect.backoff.max.ms: 1000
      metadata.max.age.ms: 300000

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics,mappings,env,loggers,business
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
    prometheus:
      enabled: true
    metrics:
      enabled: true
  prometheus:
    metrics:
      export:
        enabled: true
        step: 10s
  metrics:
    distribution:
      percentiles-histogram:
        '[http.server.requests]': true
        '[api.request.duration]': true
        '[db.query.duration]': true
        '[payment.processing.time]': true
      slo:
        '[http.server.requests]': 50ms,100ms,200ms,500ms,1s,2s,5s
    tags:
      application: ${spring.application.name}
      environment: ${ENVIRONMENT:development}
  tracing:
    sampling:
      probability: 1.0  # Sample all requests for development, reduce in production
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}

logging:
  level:
    com.ankurshala.backend: INFO
    org.springframework.security: INFO
    org.springframework.kafka: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.springframework.web.filter.CommonsRequestLoggingFilter: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{traceId}] [%X{requestId}] [%X{userId}] %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{traceId}] [%X{requestId}] [%X{userId}] %logger{36} - %msg%n"
  file:
    name: logs/ankurshala-backend.log
    max-size: 10MB
    max-history: 30
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 30
      total-size-cap: 1GB

app:
  jwt:
    secret: ${JWT_SECRET:myVeryLongAndSecureSecretKeyForHS512AlgorithmThatIsAtLeast64CharactersLongAndSecure123456789} # Updated secret - must be at least 512 bits (64 bytes)
    access-token-expiration: 900  # 15 minutes
    refresh-token-expiration: 604800  # 7 days
  encryption:
    bank-key: ${BANK_ENC_KEY:DEFAULT_BANK_ENCRYPTION_KEY_CHANGE_IN_PRODUCTION_32_CHARS_MIN_FOR_AES256_SECURITY}
  dev:
    seeder:
      enabled: ${DEV_SEEDER_ENABLED:true}
  demo:
    seeder:
      enabled: ${DEMO_SEED_ON_START:false}
  features:
    ai:
      enabled: ${FEATURES_AI_ENABLED:false}
    payments:
      enabled: ${FEATURES_PAYMENTS_ENABLED:false}
    wallet:
      enabled: ${FEATURES_WALLET_ENABLED:true}
  booking:
    buffer-minutes: 15
    timezone-default: Asia/Kolkata
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    block-duration-seconds: 300  # 5 minutes
    max-violations-before-block: 10
    default-authenticated:
      limit: 100  # requests
      window-seconds: 60  # per minute
    default-anonymous:
      limit: 20  # requests
      window-seconds: 60  # per minute
    endpoints:
      /auth/login:
        limit: 5
        window-seconds: 60  # 5 login attempts per minute
      /auth/register:
        limit: 3
        window-seconds: 300  # 3 registrations per 5 minutes
      /student/payments:
        limit: 10
        window-seconds: 60  # 10 payment operations per minute
      /public/teachers/search:
        limit: 30
        window-seconds: 60  # 30 searches per minute
