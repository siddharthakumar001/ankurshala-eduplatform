services:
  # -------- Postgres Database with pgvector --------
  postgres:
    image: pgvector/pgvector:pg15
    container_name: ankurshala_db_local
    environment:
      POSTGRES_DB: ankurshala
      POSTGRES_USER: ankur
      POSTGRES_PASSWORD: password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ankur -d ankurshala"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [ankurshala-local]
    restart: unless-stopped

  # -------- Redis Cache --------
  redis:
    image: redis:7-alpine
    container_name: ankurshala_redis_local
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [ankurshala-local]
    restart: unless-stopped

  # -------- Zookeeper (for Kafka) --------
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: ankurshala_zookeeper_local
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "2181"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks: [ankurshala-local]
    restart: unless-stopped

  # -------- Kafka --------
  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: ankurshala_kafka_local
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_SEGMENT_BYTES: 1073741824
      KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: 300000
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1
      KAFKA_COMPRESSION_TYPE: snappy
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 40s
    networks: [ankurshala-local]
    restart: unless-stopped

  # -------- MailHog (Email Testing) --------
  mailhog:
    image: mailhog/mailhog:latest
    container_name: ankurshala_mailhog_local
    ports:
      - "1025:1025"  # SMTP
      - "8025:8025"  # Web UI
    networks: [ankurshala-local]
    restart: unless-stopped

  # -------- Backend (Spring Boot) --------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ankurshala_backend_local
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      mailhog:
        condition: service_started
    ports:
      - "8080:8080"
    environment:
      # Database Configuration
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ankurshala
      DB_USERNAME: ankur
      DB_PASSWORD: password
      
      # Redis Configuration
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      
      # Kafka Configuration
      KAFKA_BROKERS: kafka:29092
      
      # Server Configuration
      SERVER_PORT: 8080
      SPRING_PROFILES_ACTIVE: dev
      
      # JWT Configuration
      JWT_SECRET: myVeryLongAndSecureSecretKeyForHS512AlgorithmThatIsAtLeast64CharactersLongAndSecure123456789
      
      # Encryption Key
      BANK_ENC_KEY: DEFAULT_BANK_ENCRYPTION_KEY_CHANGE_IN_PRODUCTION_32_CHARS_MIN_FOR_AES256_SECURITY
      
      # Email Configuration (MailHog)
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
      SMTP_USERNAME: ""
      SMTP_PASSWORD: ""
      SMTP_FROM: noreply@ankurshala.local
      
      # Demo/Development Configuration
      DEMO_SEED_ON_START: true
      DEMO_ENV: dev
      DEMO_FORCE: true
      DEMO_BULK_SEED: true
      DEV_SEEDER_ENABLED: true
      
      # AI Configuration
      # Set these from .env file or environment
      OPENAI_API_KEY: ${OPENAI_API_KEY:-sk-placeholder-for-local-development}
      AI_ENABLED: ${AI_ENABLED:-false}
      AI_PROVIDER: ${AI_PROVIDER:-openai}
      AI_DEV_MODE: ${AI_DEV_MODE:-true}
      
      # Azure OpenAI Configuration (if using Azure)
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT:-}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:-}
      AZURE_OPENAI_DEPLOYMENT_NAME: ${AZURE_OPENAI_DEPLOYMENT_NAME:-gpt-4o-mini}
      AZURE_OPENAI_EMBEDDING_DEPLOYMENT_NAME: ${AZURE_OPENAI_EMBEDDING_DEPLOYMENT_NAME:-text-embedding-ada-002}
      
      # Azure Speech Configuration (for voice features)
      AZURE_SPEECH_KEY: ${AZURE_SPEECH_KEY:-}
      AZURE_SPEECH_REGION: ${AZURE_SPEECH_REGION:-}
      AZURE_SPEECH_LANGUAGE: ${AZURE_SPEECH_LANGUAGE:-en-IN}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks: [ankurshala-local]
    restart: unless-stopped

  # -------- Frontend (Next.js) --------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8080/api
    container_name: ankurshala_frontend_local
    depends_on:
      backend:
        condition: service_started
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080/api
      BACKEND_URL: http://backend:8080/api
      NODE_ENV: development
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks: [ankurshala-local]
    restart: unless-stopped

  # -------- Prometheus (Metrics Collection) --------
  prometheus:
    image: prom/prometheus:latest
    container_name: ankurshala_prometheus_local
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks: [ankurshala-local]
    restart: unless-stopped

  # -------- Grafana (Metrics Visualization) --------
  grafana:
    image: grafana/grafana:latest
    container_name: ankurshala_grafana_local
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_SECURITY_ADMIN_USER=admin
      - GF_INSTALL_PLUGINS=grafana-clock-panel
    volumes:
      - grafana_data:/var/lib/grafana
    ports:
      - "3001:3000"
    networks: [ankurshala-local]
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  kafka_data:
  prometheus_data:
  grafana_data:

networks:
  ankurshala-local:
    driver: bridge
