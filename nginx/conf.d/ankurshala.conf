# =============================================================================
# AnkurShala Nginx Configuration
# =============================================================================
# This configuration handles:
# - HTTP to HTTPS redirect
# - SSL termination with Let's Encrypt certificates
# - Routing API requests appropriately:
#   - /api/auth/*, /api/admin/*, /api/student/*, /api/teacher/*, /api/user/* → Frontend (for cookie management)
#   - Other /api/* → Backend directly
# - Frontend serving with proper caching
# =============================================================================

# ----- HTTP listener (80): redirect to HTTPS -----
server {
  listen 80;
  listen [::]:80;
  server_name ankurshala.com www.ankurshala.com;

  access_log /var/log/nginx/access.log;
  error_log  /var/log/nginx/error.log;

  # ACME challenge for Let's Encrypt
  location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
    default_type "text/plain";
    try_files $uri =404;
  }

  # Health check endpoint
  location = /health { 
    return 200 "ok\n"; 
    add_header Content-Type text/plain; 
  }

  # Redirect everything else to HTTPS
  location / {
    return 301 https://$host$request_uri;
  }
}

# ----- HTTPS listener (443) -----
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name ankurshala.com www.ankurshala.com;

  access_log /var/log/nginx/access.log;
  error_log  /var/log/nginx/error.log;

  # SSL Configuration
  ssl_certificate     /etc/letsencrypt/live/ankurshala.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/ankurshala.com/privkey.pem;
  ssl_session_timeout 1d;
  ssl_session_cache shared:SSL:10m;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers on;
  ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';

  # Security headers
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-XSS-Protection "1; mode=block" always;
  add_header Referrer-Policy "no-referrer-when-downgrade" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  # Health check on HTTPS
  location = /health { 
    return 200 "ok\n"; 
    add_header Content-Type text/plain; 
  }

  # ========================================
  # Auth API → Frontend (Next.js sets httpOnly cookies)
  # ========================================
  location /api/auth/ {
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_pass http://frontend:3000;
  }

  # ========================================
  # Admin API → Frontend (reads cookies, forwards to backend)
  # ========================================
  location /api/admin/ {
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_pass http://frontend:3000;
  }

  # ========================================
  # Student API → Frontend (reads cookies, forwards to backend)
  # ========================================
  location /api/student/ {
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_pass http://frontend:3000;
  }

  # ========================================
  # Teacher API → Frontend (reads cookies, forwards to backend)
  # ========================================
  location /api/teacher/ {
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_pass http://frontend:3000;
  }

  # ========================================
  # User API → Frontend (reads cookies, forwards to backend)
  # ========================================
  location /api/user/ {
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_pass http://frontend:3000;
  }

  # ========================================
  # Other API endpoints → Backend directly
  # (public endpoints like /api/content/*, /api/actuator/*)
  # ========================================
  location /api/ {
    # Handle CORS preflight
    if ($request_method = 'OPTIONS') {
      add_header 'Access-Control-Allow-Origin' 'https://ankurshala.com' always;
      add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
      add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,X-CSRF-TOKEN' always;
      add_header 'Access-Control-Allow-Credentials' 'true' always;
      add_header 'Access-Control-Max-Age' 1728000;
      add_header 'Content-Type' 'text/plain; charset=utf-8';
      add_header 'Content-Length' 0;
      return 204;
    }

    # CORS headers for actual requests
    add_header 'Access-Control-Allow-Origin' 'https://ankurshala.com' always;
    add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
    add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,X-CSRF-TOKEN' always;
    add_header 'Access-Control-Allow-Credentials' 'true' always;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_pass http://backend:8080;
  }

  # ========================================
  # Static assets - long cache
  # ========================================
  location ^~ /_next/static/ {
    proxy_hide_header Cache-Control;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_pass http://frontend:3000;
  }

  # ========================================
  # Frontend (Next.js) - no cache for HTML
  # ========================================
  location / {
    proxy_hide_header Cache-Control;
    add_header Cache-Control "no-store" always;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_pass http://frontend:3000;
  }
}
